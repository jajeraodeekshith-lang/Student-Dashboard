<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management</title>
  <link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar">
       <h2>STUDENT MANAGEMENT</h2>
 
  </aside>

  <!-- Main Content -->
  <main class="main">

  <header class="header">
    <h1>STUDENT DETAILS</h1>
</header>
    <!-- Form Section -->
    <section class="form-section">
     <div class="form">
        <label for="name">Name:
            <input type="text" id="name" placeholder="Name" required pattern="[A-Za-z ]+" title="Name should contain only letters and spaces" oninput="this.value = this.value.replace(/[^A-Za-z ]/g, '')">
            </label>
            <label for="roll">Roll No:
            <input type="number" id="roll" placeholder="Roll No" required min="1" step="1">
            </label>
            <label for="marks">Marks:
            <input type="number" id="marks" placeholder="Marks" required min="1" max="100" step="1" title="Marks must be between 1 and 100">
            </label>
            <button id="addBtn" type="button">Add student</button>
        </div>
    </section>

    <!-- Table Section -->
    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>S.NO</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Marks</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
