<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <p>Student Manager</p>
    </div>

    <!-- Main -->
    <div class="main">

        <h2>Student Management</h2>
        <!-- Form -->
        <div class="form">
            <input type="text" id="name" placeholder="Name">
            <input type="number" id="roll" placeholder="Roll No">
            <input type="number" id="marks" placeholder="Marks">
            <button id="addBtn">Add Student</button>
        </div>

        <!-- Controls -->
        <div class="controls" style="margin-bottom: 15px; display: flex; gap: 10px;">
            <input type="text" id="search" placeholder="Search by name or roll..."
                style="padding: 8px; width: 60%; border: 1px solid #ddd; border-radius: 4px;">
            <button id="sortBtn"
                style="padding: 8px 15px; cursor: pointer; background: #34495e; color: white; border: none; border-radius: 4px;">Sort
                by Marks</button>
        </div>

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Marks</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>

    </div>

   

</body>

</html>
